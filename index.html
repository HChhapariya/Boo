<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boo - A Romantic Experience</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #fce7f3 0%, #fef2f2 50%, #fce7f3 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Floating hearts animation */
        .heart-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            font-size: 24px;
            animation: float-heart 10s infinite ease-in-out;
            opacity: 0;
        }

        @keyframes float-heart {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-20vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Glassmorphism card */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 48px;
            box-shadow: 0 8px 32px rgba(236, 72, 153, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            max-width: 500px;
            text-align: center;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            font-size: 48px;
            color: #ec4899;
            margin-bottom: 24px;
        }

        h2 {
            font-family: 'Pacifico', cursive;
            font-size: 32px;
            color: #f43f5e;
            margin-bottom: 16px;
        }

        p {
            font-family: 'Quicksand', sans-serif;
            font-size: 18px;
            color: #be185d;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .mascot {
            margin: 24px 0;
        }

        .button-container {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 32px;
        }

        button {
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            padding: 16px 32px;
            border-radius: 12px;
            border: none;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .yes-button {
            background: linear-gradient(135deg, #ec4899, #f43f5e);
            color: white;
            box-shadow: 0 4px 16px rgba(236, 72, 153, 0.4);
        }

        .yes-button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 24px rgba(236, 72, 153, 0.6);
        }

        .no-button {
            background: linear-gradient(135deg, #94a3b8, #64748b);
            color: white;
            position: fixed;
            transition: all 0.1s ease;
            box-shadow: 0 4px 16px rgba(100, 116, 139, 0.4);
        }

        .no-button:hover {
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <!-- Floating hearts background -->
    <div class="heart-container" id="heartContainer"></div>

    <!-- Main card -->
    <div class="card">
        <h1>Hey There! 💕</h1>
        
        <!-- Cute SVG Mascot -->
        <div class="mascot">
            <svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                <!-- Face -->
                <circle cx="60" cy="60" r="50" fill="#fce7f3" stroke="#ec4899" stroke-width="3"/>
                
                <!-- Left eye -->
                <circle cx="45" cy="50" r="4" fill="#ec4899"/>
                
                <!-- Right eye -->
                <circle cx="75" cy="50" r="4" fill="#ec4899"/>
                
                <!-- Blush left -->
                <circle cx="35" cy="60" r="8" fill="#fbcfe8" opacity="0.7"/>
                
                <!-- Blush right -->
                <circle cx="85" cy="60" r="8" fill="#fbcfe8" opacity="0.7"/>
                
                <!-- Smile -->
                <path d="M 45 70 Q 60 80 75 70" stroke="#ec4899" stroke-width="3" fill="none" stroke-linecap="round"/>
                
                <!-- Heart on top -->
                <path d="M 60 25 L 65 20 Q 70 15 75 20 Q 80 25 75 30 L 60 45 L 45 30 Q 40 25 45 20 Q 50 15 55 20 Z" fill="#ec4899"/>
            </svg>
        </div>

        <h2>Will you be mine? 💖</h2>
        <p>I promise to make every day feel special, just like this moment.</p>

        <div class="button-container">
            <button class="yes-button" onclick="handleYes()">Yes! 😍</button>
            <button class="no-button" id="noButton">No 😢</button>
        </div>
    </div>

    <script>
        // Create floating hearts
        function createHearts() {
            const container = document.getElementById('heartContainer');
            const heartSymbols = ['❤️', '💕', '💖', '💗', '💘', '💝'];
            
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 5 + 's';
                heart.style.animationDuration = (8 + Math.random() * 4) + 's';
                container.appendChild(heart);
            }
        }

        // No button evasive logic
        const noButton = document.getElementById('noButton');
        
        function moveNoButton() {
            const maxX = window.innerWidth - noButton.offsetWidth - 20;
            const maxY = window.innerHeight - noButton.offsetHeight - 20;
            
            const randomX = Math.max(10, Math.random() * maxX);
            const randomY = Math.max(10, Math.random() * maxY);
            const randomRotation = (Math.random() - 0.5) * 30; // -15 to 15 degrees
            
            noButton.style.left = randomX + 'px';
            noButton.style.top = randomY + 'px';
            noButton.style.transform = `rotate(${randomRotation}deg)`;
        }

        // Add event listeners for "No" button
        noButton.addEventListener('mouseover', moveNoButton);
        noButton.addEventListener('click', (e) => {
            e.preventDefault();
            moveNoButton();
        });
        noButton.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        // Initialize "No" button position
        moveNoButton();

        // Handle "Yes" button click
        function handleYes() {
            alert('Yay! 💕 You made my day! 🎉');
        }

        // Initialize hearts on page load
        createHearts();
    </script>
</body>
</html>
